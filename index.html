<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Installation N°85</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#020307;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
#intro{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
#intro .content{position:relative;z-index:3;padding:30px;transition:opacity 1.2s,transform 1.2s}
.kicker{font-size:12px;letter-spacing:5px;color:#9ca6ff;text-transform:uppercase;margin-bottom:24px}
h1{font-size:clamp(52px,11vw,145px);line-height:.82;margin:0;font-weight:900;letter-spacing:-7px}
h1 span{color:transparent;-webkit-text-stroke:1px #fff}
.lead{max-width:650px;margin:30px auto;color:#aeb2c0;font-size:18px;line-height:1.7}
button{border:1px solid rgba(255,255,255,.2);background:#fff;color:#05060a;border-radius:9px;padding:15px 24px;font-weight:800;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-2px)}
#status{margin-top:14px;color:#666b7b;font-size:12px}
#visual{position:absolute;inset:-20%;opacity:0;transform:scale(.8);transition:opacity 1.5s,transform 2s;background:
radial-gradient(circle at 50% 50%,rgba(100,120,255,.18),transparent 20%),
radial-gradient(circle at 20% 30%,rgba(0,220,255,.14),transparent 18%),
radial-gradient(circle at 80% 70%,rgba(170,70,255,.13),transparent 20%)}
#visual:before,#visual:after{content:"";position:absolute;inset:0;background:
linear-gradient(rgba(120,140,255,.13) 1px,transparent 1px),
linear-gradient(90deg,rgba(120,140,255,.13) 1px,transparent 1px);background-size:70px 70px;transform:perspective(500px) rotateX(55deg) scale(1.5);animation:grid 12s linear infinite}
#visual:after{background:none;border:1px solid rgba(130,150,255,.15);border-radius:50%;width:55vw;height:55vw;left:22%;top:22%;animation:spin 16s linear infinite}
@keyframes grid{to{background-position:0 70px,70px 0}}@keyframes spin{to{transform:rotate(360deg)}} 
body.playing #visual{opacity:1;transform:scale(1)}
body.playing #intro .content{opacity:0;transform:scale(1.08);pointer-events:none}
#lyrics{position:absolute;z-index:5;left:50%;bottom:11%;transform:translate(-50%,20px);width:min(900px,90%);opacity:0;text-align:center;transition:opacity .7s,transform .7s}
body.playing #lyrics{opacity:1;transform:translate(-50%,0)}
#lyricText{font-size:clamp(22px,4vw,44px);font-weight:700;line-height:1.25;text-shadow:0 3px 25px #000}
#counter{margin-top:14px;color:#8992ad;font-size:11px;letter-spacing:3px;text-transform:uppercase}
#replay{display:none;position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94)}
body.finished #replay{display:block}body.finished #lyrics{opacity:0}
body.finished #visual{opacity:.7}
@media(prefers-reduced-motion:reduce){#visual:before,#visual:after{animation:none}}
</style>
</head>
<body>
<section id="intro">
<div id="visual"></div>
<div class="content">
<div class="kicker">Dossier // 085</div>
<h1>INSTALLATION <span>N°85</span></h1>
<p class="lead">Une nouvelle expérience vous attend. De nouveaux rôles, une nouvelle atmosphère et surtout… un nouveau gameplay.</p>
<button id="start">▶ Lancer l'expérience</button>
<div id="status">Cliquez pour commencer la présentation.</div>
</div>
<div id="lyrics" aria-live="polite"><div id="lyricText"></div><div id="counter"></div></div>
<button id="replay">↻ Rejouer l'expérience</button>
<audio id="audio" src="SIte-85.mp3" preload="auto"></audio>
</section>
<script>
const audio=document.getElementById('audio'),start=document.getElementById('start'),replay=document.getElementById('replay'),status=document.getElementById('status'),lyric=document.getElementById('lyricText'),counter=document.getElementById('counter');
const lines=[
["Bienvenue sur l'installation N°85.",0],
["Vous allez découvrir un tout nouveau monde rempli de…",3],
["surprises.",7],
["De nouveaux rôles.",10],
["Une nouvelle atmosphère.",13],
["Et surtout…",16],
["un nouveau gameplay.",18],
["Alors n'attendez plus.",22],
["Venez découvrir la refonte de l'installation 85.",25]
];
function reset(){document.body.classList.remove('playing','finished');lyric.textContent="";counter.textContent="";start.textContent="▶ Lancer l'expérience";status.textContent="Cliquez pour commencer la présentation."}
function play(){document.body.classList.remove('finished');document.body.classList.add('playing');audio.currentTime=0;audio.play().then(()=>{status.textContent="Présentation en cours…"}).catch(()=>{status.textContent="Autorisez la lecture audio puis réessayez."})}
start.addEventListener('click',play);replay.addEventListener('click',play);
audio.addEventListener('timeupdate',()=>{
 const t=audio.currentTime;let current=null;
 for(const line of lines)if(t>=line[1])current=line;
 if(current){lyric.textContent=current[0];counter.textContent=Math.floor(t)+" s  /  INSTALLATION N°85"}
});
audio.addEventListener('ended',()=>{document.body.classList.remove('playing');document.body.classList.add('finished');lyric.textContent="L'installation vous attend.";counter.textContent="PRÉSENTATION TERMINÉE";status.textContent="";});
</script>
</body>
</html>
